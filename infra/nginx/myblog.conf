# =============================================================================
# myblog.conf — the S5 gateway: one nginx `server` in front of three processes
# that are started separately on the deploy box.
#
# WHERE THIS GOES
#   /etc/nginx/sites-available/myblog.conf
#   + a symlink in /etc/nginx/sites-enabled/       (Debian/Ubuntu convention)
#   The packaged `nginx.conf` includes sites-enabled from INSIDE its `http { }`
#   block, which is why `log_format`, `upstream` and `server` may sit at top
#   level in this file — and why adding an `http { }` or `events { }` wrapper
#   here would break it. See README.md for the two commands.
#   One prerequisite: `/etc/nginx/sites-enabled/default` must be gone. The stock
#   site also claims `listen 80 default_server`, and two of those make `nginx -t`
#   fail with `[emerg] duplicate default server`.
#
# WHAT IT FRONTS (all of it measured on this project, not assumed)
#   /            -> apps/web-next  `next start -H 127.0.0.1 -p 3000`
#                   owns `/`, `/blog/<slug>`, `/sitemap.xml`, `/robots.txt`,
#                   `/rss.xml` (internally rewritten to `/rss`), `/icon.svg`
#                   and `/_next/static/*`.
#   /admin/...    -> apps/web, a *static build* at apps/web/dist. No process, no
#                   port. Admin UI paths are client-side routed:
#                   `/admin/articles`, `/admin/articles/new`,
#                   `/admin/articles/<slug>/edit`.
#   /api/v1/...   -> apps/api  `node dist/server.js`, loopback 127.0.0.1:3001.
#   /health,      -> the same API. `/health` is liveness and never answers 503;
#   /ready           `/ready` answers 503 only when postgres or redis is down
#                    (`trafficOk` in apps/api/src/routes/health.ts), and
#                    answers 200 `degraded` when only MinIO is down.
#   Media (MinIO, :9000) is NOT fronted — see the known-gap block at the bottom.
#
# WHAT IS DELIBERATELY NOT IN THIS FILE (S5 scope ruling, 2026-10-08: the stage
# is "reverse proxy + health checks + fault visibility" and nothing else):
#   - portal hub / iframe embedding. `X-Frame-Options` and CSP `frame-ancestors`
#     are absent ON PURPOSE, not forgotten: setting `DENY` here would be a
#     landmine for the embedding work that was deferred, and nobody would
#     connect the blank iframe back to this file.
#   - SSO / a shared cookie domain. The gateway already makes the browser and
#     the API same-origin, so there is nothing to unify yet.
#   - sub-path module deployment (`base:`/`basename:` plumbing for extra apps).
#   - TLS and a real domain -> S8 (`listen 443` below carries the reason).
#   - load balancing over two API instances -> S7; the `upstream` blocks are
#     already shaped for it so that upgrade is one added `server` line.
# =============================================================================


# ── fault visibility: a log format that can tell 502-from-nginx apart from
#    503-from-the-API ────────────────────────────────────────────────────────
# Declared here (not in nginx.conf) so the gateway's own file carries its own
# debugging story. The name must be unique in the `http` block — if a
# `log_format myblog_gateway` ever exists elsewhere, `nginx -t` fails with
# "duplicate log format name".
#
# The four `$upstream_*` fields are the whole point: without them an operator
# reading a 502 cannot tell "nginx could not connect to 127.0.0.1:3001" (API
# process dead — the fix is `pm2 restart`/`systemctl`) from "the API answered
# 502" (application bug). `ust=` carries the upstream's own status — comma-joined
# when more than one attempt happened, which is how a silent retry would be
# caught red-handed — and `urt=` against `rt=` separates a slow upstream from a
# slow client.
log_format myblog_gateway
    '$remote_addr - [$time_iso8601] "$request" $status '
    'ust=$upstream_status uct=$upstream_connect_time urt=$upstream_response_time '
    'ua="$upstream_addr" rt=$request_time '
    '"$http_referer" "$http_user_agent"';


# ── upstreams ────────────────────────────────────────────────────────────────
# One `server` each today. Written as `upstream` blocks rather than a literal
# `proxy_pass http://127.0.0.1:3001` for two reasons: (a) it is the shape S7
# needs, so failover becomes one added line instead of a rewrite of every
# location, and (b) a named upstream is what shows up in `$upstream_addr` in
# the log above, which makes "which process was down" answerable from the log.
#
# `max_fails`/`fail_timeout` are left at their defaults on purpose: with a
# single server in the group there is nowhere else to send the request, so
# marking it unavailable only changes the error code, not the outcome. They
# start earning their keep when the second instance appears.
#
# If S8 containerises the apps and these become service names: nginx resolves
# a `proxy_pass`/upstream hostname ONCE at startup, so `docker compose
# --scale api=N` would keep sending traffic to the first IP only. That fix is
# `resolver 127.0.0.11 valid=10s;` plus a variable `proxy_pass` — recorded in
# .trellis/tasks/09-24-blog-production-backend/design.md §1.3 as the trap to
# avoid spending a day on.
upstream myblog_api {
    server 127.0.0.1:3001;      # apps/api: server.ts calls app.listen() with the
                                # host literal '127.0.0.1' and no HOST variable, so
                                # loopback :3001 is the only place it can answer
    # server 127.0.0.1:3002;    # S7: second instance, round-robin from here

    # Upstream keepalive only actually happens with `proxy_http_version 1.1`
    # and a cleared `Connection` request header — both set in the server block
    # below. Without those two lines this directive is decoration.
    keepalive 32;
}

upstream myblog_web_next {
    server 127.0.0.1:3000;      # apps/web-next, `next start -H 127.0.0.1 -p 3000`
    keepalive 16;               # SSR HTML is short-lived; fewer sockets than the API
}


server {
    # `default_server` is explicit rather than "it is the only file in
    # sites-enabled, so it wins by being first": a request with any other Host
    # (a scanner sending the IP, a probe sending `localhost`, someone pointing an
    # unrelated domain at this box) must land here and get our routes, not the
    # 404 of a second site added later.
    listen 80 default_server;
    # listen [::]:80 default_server;   # uncomment only if `ip -6 addr` shows an
                                      # address: a missing family is a bind error
                                      # that stops nginx from STARTING (nginx -t
                                      # still passes, so this fails on deploy day)

    # server_name 60.205.178.223;
    # ↑ Left commented because it is a bare IP. `server_name` matches the Host
    #   header, and with an IP the thing a browser sends is the same string, so
    #   the line would work — but it adds nothing over `default_server` while
    #   making the file wrong the moment a domain (or a second IP) appears.
    #   A real domain is also the precondition for TLS: a publicly trusted
    #   certificate is not obtainable for a bare IP, which is why `listen 443`
    #   below is not merely unwired but un-wireable. That is the S8 upgrade.

    # listen 443 ssl http2;            # S8: domain + ACME certificate +
    # ssl_certificate ...;             # `COOKIE_SECURE=true` in apps/api.
    # ssl_certificate_key ...;         # Until then the session cookie travels
    #                                  # cleartext over the public internet —
    #                                  # stated, not hidden, because "http on a
    #                                  # public IP" is a decision with a cost.

    access_log /var/log/nginx/myblog.access.log myblog_gateway;
    error_log  /var/log/nginx/myblog.error.log warn;

    # Version string out of `Server:` and out of nginx's own error pages.
    # NOTE: `smoke.sh` detects "am I talking to the gateway?" from the `Server:`
    # header, and this keeps that header — it only trims the version. Do not
    # "clean up" further with `more_clear_headers Server`, it would turn the
    # smoke script's PASS/FAIL into "cannot verify" for everyone.
    server_tokens off;

    # ── request body size: the one number in this file that is not cosmetic ──
    # nginx's own default is 1 MiB. The markdown import endpoint carries a
    # route-scoped limit of 8 MiB (`IMPORT_BODY_LIMIT_BYTES` in
    # apps/api/src/modules/articles/schema.ts, applied as the `bodyLimit` of the
    # import route in apps/api/src/modules/articles/routes.ts). Left at the default, nginx
    # would answer its own HTML 413 at 1 MiB and the API would never get to
    # speak — the user sees a gateway error page for what is really a
    # too-many-articles import. This exact mismatch is why the number is not
    # left alone.
    #   16m = 2x the largest body the API is willing to read, so that a 413 from
    #   the API (JSON, with a `code` and a `requestId`) is the answer at every
    #   size the API cares about, and nginx's 413 only ever fires on traffic the
    #   API would never accept anyway.
    #   Not higher: everything above the API's own limits is buffering, disk
    #   writes to `client_body_temp` and event-loop time spent on requests we
    #   will refuse.
    # Everything else on this box is small-bodied: Fastify's global `bodyLimit`
    # is its 1 MiB default (asserted by the API's own test, "keeps every other
    # endpoint on Fastify's default bodyLimit" in
    # apps/api/src/test/articles-import.test.ts), and oversized posts to
    # those routes should be answered by the API in JSON — which 16m allows.
    # Image uploads are NOT affected by this line at all: the browser PUTs the
    # file straight to MinIO with a presigned URL (see the known-gap block), so
    # those bytes never pass through nginx.
    client_max_body_size 16m;
    client_body_timeout  30s;   # an 8 MiB import from a laptop on uplink ADSL

    # ── response compression ────────────────────────────────────────────────
    gzip on;
    gzip_vary on;               # so a later CDN does not hand a gzipped body to
                                # a client that never asked for one
    gzip_min_length 1024;       # below this the framing overhead exceeds the win
    gzip_comp_level 5;          # 6+ costs CPU on a single-ECS box for ~1% bytes
    # `gzip_proxied any` is load-bearing, not a style choice: the stock default
    # is `off`, which means nginx compresses NOTHING that comes from an
    # upstream. On this gateway every dynamic byte is proxied (Next, the API),
    # so without this line gzip would apply only to the SPA's static files and
    # the article HTML would go out uncompressed.
    # No SSE/streamed endpoint exists today; if one is added, turn gzip off for
    # that location specifically (`gzip off;`) — compressed buffering would
    # defeat it.
    # Do NOT add `text/html` to the list below: it is always compressed, and
    # naming it makes `nginx -t` fail with `[emerg] duplicate MIME type`.
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/rss+xml
        application/xml
        image/svg+xml;          # both icons are SVG: `app/icon.svg` from Next,
                                # `favicon.svg` from the SPA's dist
    # brotli is not an option here: it needs a third-party module that the
    # Debian/Ubuntu nginx package does not ship. Saying so keeps the next person
    # from "tidying" this into `brotli on;`.

    # ── proxy defaults, shared by every proxied location ────────────────────
    # Kept at `server` level and deliberately NOT repeated per-location, because
    # `proxy_set_header` (and `add_header`) are inherited as a SET, not merged:
    # the first `proxy_set_header` written inside a location discards every
    # server-level one, which would silently drop `Host` and the `X-Forwarded-*`
    # pair from that route. Anyone adding a header to one location must repeat
    # this whole group there. That is the bug this layout is designed to make
    # impossible.
    proxy_http_version 1.1;                 # required for upstream `keepalive`
    proxy_set_header Connection "";         # ... and for clearing `close`
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;   # matters on the S8 TLS cutover

    # These four lines are a CONTRACT, not decoration, and the API side of it was
    # landed on 2026-10-08 in the S6 rate-limiting work: `apps/api/src/app.ts` sets
    # `trustProxy: 'loopback'`, so Fastify reads the client address from
    # `X-Forwarded-For` ONLY when the socket peer is already loopback — which is
    # exactly this gateway and nothing else. Delete or "simplify" `X-Forwarded-For`
    # here and every visitor collapses into one bucket (the gateway's own address),
    # which is fatal for the anonymous `GET /auth/github/start` limit: one visitor
    # can then exhaust the allowance for everyone.
    #
    # `$proxy_add_x_forwarded_for` and not `$remote_addr` on purpose: the former
    # appends this hop's address to the list the client already sent, so the
    # right-most entry is the real client as nginx saw it. `apps/api` takes the
    # LAST element of that list and truncates at the first untrusted entry
    # (their comment in app.ts walks the fastify@5.12.5 source), so the forged
    # left-hand entries a client may have put there are never reached. If nginx
    # ever gains another proxy in front of it, that walk is what has to be
    # re-read — the trust boundary is "the peer is loopback", not "the header
    # exists".
    #
    # `Host` is forwarded because both upstreams want a sane one, and note that
    # neither derives a *public URL* from it: the API builds OAuth redirects from
    # `API_PUBLIC_URL` and `PORTAL_WEB_ORIGIN`, and Next builds sitemap/canonical
    # URLs from `NEXT_PUBLIC_SITE_URL` (apps/web-next/lib/site.ts). Deliberate on
    # their side — so a spoofed Host cannot poison a sitemap, and a wrong public
    # URL cannot be fixed here.
    #
    # `underscores_in_headers` stays off (the default): headers containing `_`
    # are dropped by nginx. The API's CSRF gate reads `x-requested-with`
    # (`requireCsrfHeader` in apps/api/src/plugins/auth.ts) — hyphens — so admin
    # writes survive the gateway. If that header is ever renamed with an
    # underscore, it will vanish here first and the 403 will look like an
    # application bug.

    # Fail fast rather than hang: 2s to open a socket to a process on the same
    # box is generous, and a dead upstream should show the @api_down answer
    # quickly instead of occupying a worker.
    proxy_connect_timeout 2s;
    proxy_send_timeout   15s;
    # 60s on the read side: the slowest thing on this box is the 8 MiB markdown
    # import (parse + insert per file) and Next's first SSR of an article page.
    # Both are well under a minute; a longer value just means a slower outage.
    proxy_read_timeout   60s;

    # Single upstream, and the point of this line is what it does NOT contain.
    # Triggers are `error timeout` only — no `http_502 http_503 http_504`:
    # a 503 from `/ready` is a real, correct answer about postgres/redis and
    # re-issuing the request would (a) hide it and (b) hit the same process
    # again. And `non_idempotent` is absent, which is the directive that keeps
    # the verbs this API actually routes writes for — POST, PATCH, DELETE, i.e.
    # the `methods:` list of the `@fastify/cors` registration in
    # apps/api/src/app.ts — safe from a second execution. A retried
    # `POST /api/v1/articles` or `POST /api/v1/articles/import` is a duplicate
    # article, not a recovered request; `GET`/`HEAD` are the only verbs a retry
    # could ever be honest about.
    # `tries 1` states that guarantee in this file instead of leaving it as a
    # side effect of "there is only one server to fail over to". S7 must revisit
    # both lines together: reads will want `tries 2`, and writes must then be
    # protected by the missing `non_idempotent`, never by this number.
    proxy_next_upstream error timeout;
    proxy_next_upstream_tries 1;

    # Left at its default (`proxy_intercept_errors off`) ON PURPOSE, and this is
    # the one line here that would break the API's error contract if "tidied":
    # with `on`, nginx would take over any 5xx *returned by* the upstream and
    # replace it with nginx's HTML page — so the API's JSON error envelope
    # (`{"error":{"code":...,"requestId":...}}`) would disappear for 500s and
    # `/ready`'s 503 would stop being the load-balancer signal it is. nginx's
    # own 502/504 are caught by the `error_page` lines below instead, which only
    # fire for errors nginx generates itself.
    #
    # `proxy_redirect` is untouched for the same class of reason: the API emits
    # absolute Locations built from `API_PUBLIC_URL`/`PORTAL_WEB_ORIGIN`, never
    # from `Host`, so there is nothing for nginx to rewrite — and that is also
    # why a wrong `PORTAL_WEB_ORIGIN` lands the OAuth callback on the API's own
    # port, the defect this project already had (README.md, env table).

    # =====================================================================
    # 1. API — /api/v1, /health, /ready
    # =====================================================================
    location /api/v1 {
        # NO URI part on proxy_pass. `proxy_pass http://myblog_api;` forwards the
        # original path verbatim, which is what the API wants because its routes
        # are absolute (`/api/v1/articles`, not `/articles`). Writing
        # `http://myblog_api/` here would strip the `/api/v1` prefix during the
        # location substitution and every call would 404 — with the gateway
        # looking healthy, because nginx would happily proxy the mangled path.
        proxy_pass http://myblog_api;
        error_page 502 503 504 @api_down;
    }

    # Exact matches, not prefixes: `/health` and `/ready` are the API's two
    # process-level probes, and `location =` guarantees nothing under those names
    # is captured and also guarantees a future Next page called `/health/report`
    # still reaches Next.
    location = /health {
        proxy_pass http://myblog_api;
        error_page 502 503 504 @api_down;
    }

    location = /ready {
        # Not cached, not retried, and answered even when the API is limping:
        # this is the probe a human runs first. The API's own dependency checks
        # are bounded at 2s each (health.ts DEPENDENCY_TIMEOUT_MS), so nginx's
        # 60s read timeout is never what ends this request.
        proxy_pass http://myblog_api;
        add_header Cache-Control "no-store" always;
        error_page 502 503 504 @api_down;
    }

    # =====================================================================
    # 2. /admin — the Vite SPA, a static build served from a sub-path it was
    #    NOT built for. Read this block before changing anything here.
    # =====================================================================
    #
    # The measured shape of the artifact (`apps/web/dist`, built by
    # `pnpm --filter web build`, which today runs with Vite's default
    # `base: '/'` — nothing in apps/web/vite.config.ts sets it):
    #   index.html                 contains <div id="root"></div> and
    #                              <script src="/assets/index-<hash>.js">
    #   assets/index-<hash>.js     content-hashed filenames
    #   assets/index-<hash>.css
    #   favicon.svg
    # Two facts decide the routing:
    #   (a) Because `base` is '/', every asset URL baked into index.html is
    #       ROOT-absolute — `/assets/...`, `/favicon.svg` — NOT
    #       `/admin/assets/...`.
    #   (b) The router is a plain `<BrowserRouter>` with no `basename`
    #       (apps/web/src/App.tsx:39) and its admin routes are declared WITH the
    #       prefix already: `/admin/articles`, `/admin/articles/new`,
    #       `/admin/articles/<slug>/edit` (App.tsx:50-52). So the path the router
    #       matches is the full URL path, `/admin/articles` included, and the
    #       SPA's own `<Link>`s emit `/admin/...`.
    #
    # Which means `try_files ... /admin/index.html` ALONE is not enough, and this
    # is where a gateway like this goes quietly wrong: the deep link would be
    # answered, and the browser would then ask for `/assets/index-<hash>.js` at
    # the ORIGIN ROOT — where `location /` hands it to Next, which has no such
    # route and answers with its 404 page. The visible symptom is a blank admin
    # screen with failed module loads in the console, while `curl /admin/articles`
    # looks perfectly fine at 200. So the one artifact is served from TWO
    # locations and the pairing is load-bearing:
    #   /admin/   -> the HTML, deep links falling back to the SPA's own index.html
    #   /assets/  -> that same dist's hashed bundle, at the root, because that is
    #                where the baked URLs point
    #   /favicon.svg -> same reason (index.html's <link rel="icon"> is absolute)
    # Root `/assets/` is free to take: apps/web-next has no `app/assets` route
    # and no `public/` directory at all (checked), so Next cannot answer anything
    # under it. That is the precondition of this whole block — if a Next route or
    # a `public/assets` folder ever appears, revisit here first.
    #
    # THE CLEANER VERSION NEEDS ONE APPLICATION-SIDE LINE, NOT A nginx LINE:
    # setting `base: '/admin/'` for the build (apps/web/vite.config.ts, inside
    # the `build: { }` object at line 16-18) makes the emitted index.html ask for
    # `/admin/assets/...`, and then `location /assets/` and `location
    # = /favicon.svg` below get deleted and `/admin/` serves everything. Do NOT
    # also add `basename="/admin"` to the `<BrowserRouter>`: the route table
    # already carries the `/admin` prefix (App.tsx:50-52), so a basename would
    # double it and the admin pages would render nothing at `/admin/admin/*`.
    # That change is outside S5's scope (this stage must not edit apps/web/**),
    # so this file is written for the build that exists today.
    #
    # On the deploy box, the dist directory is copied to /var/www/myblog/admin/.
    # nginx reads it as `www-data`, so the directory needs o+rX — a `rsync` into a
    # 0700 home directory returns 403 here and looks like a routing bug.

    location = /admin {
        # `/admin` does not match the prefix `/admin/`, and without this it would
        # fall through to Next's 404 page. 302 rather than 301 because a cached
        # permanent redirect outlives the config that issued it, and S8 will
        # change this host's shape (domain + TLS).
        return 302 /admin/;
    }

    location /admin/ {
        # `alias` (not `root`) because the on-disk directory is the dist itself,
        # not a `.../admin/admin` path that a `root` + URI concatenation would ask
        # for. Trailing slash on both sides of the alias pair is required.
        alias /var/www/myblog/admin/;
        index index.html;

        # The subpath fallback: try the real file (a hashed asset placed here by
        # an older build, favicon.svg, anything actually on disk), otherwise hand
        # out the SPA's own entry HTML for every deep link. The fallback is a URI
        # beginning with `/admin/`, so it re-enters THIS location and resolves
        # through the same alias — no rewrite loop, because the file exists.
        #
        # Deliberately no `$uri/`: this build has no directory-shaped URLs, and
        # `alias` + `try_files $uri/` is the pairing easiest to get subtly wrong —
        # the directory form is resolved against the alias, and a mismatched
        # trailing slash shows up as 403/404s that look like a broken fallback.
        try_files $uri /admin/index.html;

        # The HTML is the one thing here that must never be cached: it is the
        # only file whose `/assets/index-<hash>.js` reference changes on every
        # deploy. Cache it and a new build is invisible until the browser gives
        # up on its heuristic freshness — which looks like "the deploy did not
        # take". `no-cache` (revalidate) not `no-store`, so a repeat visit still
        # gets a cheap 304.
        add_header Cache-Control "no-cache";
    }

    # =====================================================================
    # 3. Immutable assets — hashed filenames only, nowhere else
    # =====================================================================
    location /assets/ {
        # SPA bundle. Content-hashed (`index-5adcb305.js` measured in
        # apps/web/dist/assets/), so a year of freshness can never serve a stale
        # body: when the content changes, the filename changes, and the HTML
        # above (which is `no-cache`) is what points at the new name.
        alias /var/www/myblog/admin/assets/;
        # Exactly one Cache-Control line on purpose. `add_header` rather than
        # `expires 1y;` because `expires` also writes that header, and
        # `expires` + `add_header Cache-Control` together emit TWO Cache-Control
        # headers — and a two-value Cache-Control is how a "why is this still
        # revalidating" afternoon starts. There is no upstream here, so nothing
        # needs hiding; the `/_next/static/` block below does hide first, because
        # there IS an upstream there whose header nginx would otherwise pass
        # alongside this one.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # `.js` must arrive with a JavaScript MIME type or the browser refuses
        # the module outright — this file relies on the packaged nginx.conf's
        # `include /etc/nginx/mime.types;`. If this config is ever moved into a
        # stripped nginx.conf that lacks that line, the SPA goes blank first.
        #
        # And: do not copy `*.map` into this directory. `sourcemap: 'hidden'` in
        # apps/web/vite.config.ts means the bundle carries no `sourceMappingURL`
        # comment (checked against apps/web/dist/assets/index-5adcb305.js), but
        # Vite still WRITES the map file next to it (index-5adcb305.js.map, 7.2
        # MB measured), and a `.map` beside a hashed `.js` the HTML does name is
        # one string append away. The README's copy step excludes them; if the
        # dist is ever copied wholesale, this location will serve the admin UI's
        # TypeScript sources to anybody.
        try_files $uri =404;
        # `=404` rather than a fallback to index.html: a missing hashed asset is
        # a stale HTML or a half-deployed dist, and answering it with HTML (which
        # the browser then tries to parse as a module) turns a 404 in the network
        # panel into a syntax error in the console.
    }

    location = /favicon.svg {
        # index.html's `<link rel="icon" href="/favicon.svg">` is absolute
        # because `base` is '/', same coupling as `/assets/` above.
        alias /var/www/myblog/admin/favicon.svg;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location /_next/static/ {
        proxy_pass http://myblog_web_next;
        # Next already marks these immutable in production; hide-and-add rather
        # than trusting it keeps exactly one Cache-Control on the wire no matter
        # which Next version is running, and makes the gateway's intent readable
        # from this file. Same content-hash argument as `/assets/`.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        error_page 502 503 504 @web_down;
    }

    # =====================================================================
    # 4. Everything else — Next.js
    # =====================================================================
    location / {
        # Position in this file decides nothing — nginx matches by specificity,
        # not by order: `/api/v1`, `/admin/`, `/assets/` and `/_next/static/` are
        # longer prefixes and `/health`, `/ready` are exact matches, so all of
        # them win over this catch-all. A regex location added later would beat
        # those prefixes too (regexes are tried before a non-`^~` prefix match is
        # accepted), which is the thing to remember when someone reaches for
        # `location ~* \.(js|css)$`.
        proxy_pass http://myblog_web_next;
        error_page 502 503 504 @web_down;

        # No `Cache-Control` here, deliberately, and this is not an oversight:
        # the public pages are ISR with a 60-second window (`export const
        # revalidate = 60`, apps/web-next/app/page.tsx), and the header that
        # carries that window is written by Next. nginx adding `no-cache` to `/`
        # would fight it — and unlike a browser, a CDN or a monitoring probe
        # would then report the page as fresh-forever or dead, not the way it
        # actually is.
    }

    # =====================================================================
    # 5. Fault visibility: what a visitor sees when a process is down
    # =====================================================================
    # Two named locations because "the blog pages are down" and "the API is down"
    # are different incidents with different fixes, and an operator should not
    # have to guess which one a bare 502 means. Bodies are one line of JSON/HTML
    # inline on purpose: no file to deploy, nothing to keep in sync, and the
    # shape matches what the API's own envelope looks like (`{"error":{...}}`) so
    # a client that already parses the API's errors parses these too.
    location @api_down {
        default_type application/json;
        # No trailing newline on purpose: whether the config parser unescapes `\n`
        # inside a quoted string is one more thing nobody should have to remember,
        # and a JSON body does not need one.
        return 502 '{"error":{"code":"GATEWAY_UPSTREAM_UNAVAILABLE","message":"the gateway could not reach the portal API on 127.0.0.1:3001","gateway":"nginx","retry":"safe for GET only"}}';
    }

    location @web_down {
        default_type text/html;
        return 502 '<!doctype html><meta charset="utf-8"><title>暂时不可用</title><p>博客页面（127.0.0.1:3000）没有应答。API 若仍在运行，管理端 <a href="/admin/">/admin/</a> 仍可用。</p>';
    }

    # =====================================================================
    # KNOWN GAP: media is not fronted (MinIO, port 9000) — recorded, not fixed
    # =====================================================================
    # There is no `location /media`, and a future one is not a proxy directive
    # away. The upload path asks the API to presign a PUT against
    # `MEDIA_ENDPOINT` and the browser sends that PUT straight to the host in
    # the URL; an S3 signature covers the `Host` header, so putting the bucket
    # behind this origin would change the signed host and break every upload
    # with `SignatureDoesNotMatch` — SPIKE-E measured exactly this class of
    # failure (and also that the presign is a PUT URL, not a POST policy).
    # Visitor-facing <img> reads have the same shape: they load from
    # `MEDIA_PUBLIC_BASE_URL`, also an absolute URL, also not through here.
    # What a real /media story must decide first:
    #   1. sign against the public origin (MEDIA_ENDPOINT = this gateway) so the
    #      signature and the request agree, or
    #   2. keep the bucket off-origin and give it its own hostname + TLS cert, or
    #   3. proxy read-only (bucket policy is already public-read) and leave
    #      writes direct — the cheapest half-win, but it splits one feature's
    #      bytes across two origins, which is its own kind of confusing.
    # MinIO stays reachable on :9000 by design; infra/docker-compose.yml records
    # why that port is deliberately NOT loopback-bound (browser PUTs + public
    # reads must reach it off-box; bucket policy and signatures bound it instead).
}
